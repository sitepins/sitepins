name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The app's next.config.mjs refuses to load without these, and `next typegen`
# (typecheck) loads it as well as `next build`. Placeholders only.
env:
  NEXT_PUBLIC_BRAND_NAME: Sitepins
  NEXT_PUBLIC_BRAND_URL: https://sitepins.com
  NEXT_PUBLIC_BRAND_SLUG: sitepins
  NEXT_PUBLIC_BRAND_LOGO: /images/logo.svg
  NEXT_PUBLIC_BRAND_LOGO_DARK: /images/logo-white.svg
  NEXT_PUBLIC_BRAND_LOGO_ICON: /images/logo-icon.svg
  NEXT_PUBLIC_BRAND_LOGO_WIDTH: "136"
  NEXT_PUBLIC_BRAND_LOGO_HEIGHT: "40"
  NEXT_PUBLIC_BRAND_FAVICON: /images/favicon.png
  NEXT_PUBLIC_TERMS_URL: https://sitepins.com/terms
  NEXT_PUBLIC_PRIVACY_URL: https://sitepins.com/privacy-policy
  NEXT_PUBLIC_SUPPORT_URL: https://sitepins.com/contact
  NEXT_PUBLIC_UPDATES_URL: https://updates.sitepins.com
  NEXT_PUBLIC_STATUS_URL: https://status.sitepins.com
  NEXT_PUBLIC_COMMUNITY_URL: https://discord.gg/KrpvHfqcNA
  NEXT_PUBLIC_DOCS_URL: https://docs.sitepins.com
  NEXT_PUBLIC_SOURCE_URL: https://github.com/sitepins/sitepins
  NEXT_PUBLIC_GIT_APP_NAME: sitepins-ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (api + web)
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: White-label guard
        run: pnpm brand:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (api + web)
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor, 24 is current. Add windows-latest here once
        # the suite has been run on it at least once.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (api + web)
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm build:api

      # Placeholders only. `next build` collects page data for the API routes,
      # which construct URLs from these at module scope and throw on an empty
      # value — the build does not reach the network.
      - name: Build web
        run: pnpm build:app
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_HP_WS_URL: ws://localhost:4000/api/v1/editor/collab

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Start a clean Compose stack
        run: |
          sh scripts/setup-docker.sh
          env -i PATH="$PATH" HOME="$HOME" sh scripts/docker.sh up --build --wait --wait-timeout 120

      - name: Check first signup and the web session
        run: |
          api=http://localhost:4000/api/v1/auth
          web=http://localhost:3000
          email=docker-smoke@example.com
          password="$(openssl rand -hex 10)Aa1!"
          cookies="$(mktemp)"

          curl -fsS "$web/manifest.webmanifest" | jq -e '.name == "CMS" and .icons[0].src == "/images/cms-icon.png"' >/dev/null
          curl -fsS "$web/images/cms-icon.png" -o /dev/null
          curl -fsS "$web/register" -o /dev/null
          curl -fsS "$api/sign-up/email" \
            -H "Origin: $web" -H 'Content-Type: application/json' \
            -d "{\"name\":\"Docker Smoke\",\"email\":\"$email\",\"password\":\"$password\"}" \
            -o /dev/null
          otp="$(sh scripts/docker.sh logs --no-color api | sed -n 's/.*\[mailer\] OTP: \([0-9]\{6\}\).*/\1/p' | tail -n 1)"
          test -n "$otp"
          curl -fsS "$api/email-otp/verify-email" \
            -H "Origin: $web" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"otp\":\"$otp\"}" -o /dev/null
          curl -fsS "$api/sign-in/email" \
            -H "Origin: $web" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"$password\"}" -c "$cookies" -o /dev/null

          test "$(curl -sS http://localhost:4000/api/v1/bucket/upload -X POST -b "$cookies" -o /dev/null -w '%{http_code}')" = 503
          test "$(curl -fsS "$web/login" -o /dev/null -w '%{http_code}')" = 200
          test "$(curl -fsS "$web/login?from=/dashboard" -b "$cookies" -o /dev/null -w '%{http_code} %{redirect_url}')" = "302 $web/dashboard"

      - name: Print service logs on failure
        if: failure()
        run: sh scripts/docker.sh logs --tail=100 mongo api web

      - name: Remove the test stack
        if: always()
        run: sh scripts/docker.sh down -v
