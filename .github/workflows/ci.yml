name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The app's next.config.mjs refuses to load without these, and `next typegen`
# (typecheck) loads it as well as `next build`. Placeholders only.
env:
  NEXT_PUBLIC_BRAND_NAME: Sitepins
  NEXT_PUBLIC_BRAND_URL: https://sitepins.com
  NEXT_PUBLIC_BRAND_SLUG: sitepins
  NEXT_PUBLIC_BRAND_LOGO: /images/logo.svg
  NEXT_PUBLIC_BRAND_LOGO_DARK: /images/logo-white.svg
  NEXT_PUBLIC_BRAND_LOGO_ICON: /images/logo-icon.svg
  NEXT_PUBLIC_BRAND_LOGO_WIDTH: "136"
  NEXT_PUBLIC_BRAND_LOGO_HEIGHT: "40"
  NEXT_PUBLIC_BRAND_FAVICON: /images/favicon.png
  NEXT_PUBLIC_TERMS_URL: https://sitepins.com/terms
  NEXT_PUBLIC_PRIVACY_URL: https://sitepins.com/privacy-policy
  NEXT_PUBLIC_SUPPORT_URL: https://sitepins.com/contact
  NEXT_PUBLIC_UPDATES_URL: https://updates.sitepins.com
  NEXT_PUBLIC_STATUS_URL: https://status.sitepins.com
  NEXT_PUBLIC_COMMUNITY_URL: https://discord.gg/KrpvHfqcNA
  NEXT_PUBLIC_DOCS_URL: https://docs.sitepins.com
  NEXT_PUBLIC_SOURCE_URL: https://github.com/sitepins/sitepins
  NEXT_PUBLIC_GIT_APP_NAME: sitepins-ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (api + web)
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: White-label guard
        run: pnpm brand:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (api + web)
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor, 24 is current. Add windows-latest here once
        # the suite has been run on it at least once.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (api + web)
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm build:api

      # Placeholders only. `next build` collects page data for the API routes,
      # which construct URLs from these at module scope and throw on an empty
      # value — the build does not reach the network.
      - name: Build web
        run: pnpm build:app
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_HP_WS_URL: ws://localhost:4000/api/v1/editor/collab
