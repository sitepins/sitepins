# Run sh scripts/setup-docker.sh before sh scripts/docker.sh up --build --wait.

services:
  mongo:
    image: mongo:7
    # Single-node replica set: better-auth and the services use transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks: [database]
    healthcheck:
      # Initiates the set on first run; healthy once this node is primary.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "var s; try { s = rs.status().myState } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(s === 1 ? 0 : 1)",
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - api/.env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/sitepins?replicaSet=rs0}
      NODE_ENV: production
      PORT: "4000"
      BASE_URL: ${BASE_URL:-http://localhost:${API_PORT:-4000}}
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-3000}}
      CORS_ORIGINS: ${CORS_ORIGINS:-${APP_URL:-http://localhost:${WEB_PORT:-3000}}}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run sh scripts/setup-docker.sh and set BETTER_AUTH_SECRET in api/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in api/.env}
      JWT_TOKEN_EXPIRE: ${JWT_TOKEN_EXPIRE:-7d}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in api/.env}
      SANDBOX_ENCRYPTION_KEY: ${SANDBOX_ENCRYPTION_KEY:?Set SANDBOX_ENCRYPTION_KEY in api/.env}
      BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-CMS}
      BRAND_URL: ${NEXT_PUBLIC_BRAND_URL:-${APP_URL:-http://localhost:${WEB_PORT:-3000}}}
      BRAND_SLUG: ${NEXT_PUBLIC_BRAND_SLUG:-cms}
      BRAND_SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL:-none}
      GIT_APP_NAME: ${NEXT_PUBLIC_GIT_APP_NAME:-cms}
    depends_on:
      mongo:
        condition: service_healthy
    networks: [default, database]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-${BASE_URL:-http://localhost:${API_PORT:-4000}}/api/v1}
        NEXT_PUBLIC_HP_WS_URL: ${NEXT_PUBLIC_HP_WS_URL:-ws://localhost:${API_PORT:-4000}/api/v1/editor/collab}
        NEXT_PUBLIC_DASHBOARD_HOME: ${NEXT_PUBLIC_DASHBOARD_HOME:-/dashboard/account}
        NEXT_PUBLIC_BUCKET_URL: ${NEXT_PUBLIC_BUCKET_URL:-}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-CMS}
        NEXT_PUBLIC_BRAND_URL: ${NEXT_PUBLIC_BRAND_URL:-${APP_URL:-http://localhost:${WEB_PORT:-3000}}}
        NEXT_PUBLIC_GIT_APP_NAME: ${NEXT_PUBLIC_GIT_APP_NAME:-cms}
        NEXT_PUBLIC_GITLAB_CLIENT_ID: ${NEXT_PUBLIC_GITLAB_CLIENT_ID:-}
        NEXT_PUBLIC_BRAND_SLUG: ${NEXT_PUBLIC_BRAND_SLUG:-cms}
        NEXT_PUBLIC_BRAND_LOGO: ${NEXT_PUBLIC_BRAND_LOGO:-/images/cms-mark.svg}
        NEXT_PUBLIC_BRAND_LOGO_DARK: ${NEXT_PUBLIC_BRAND_LOGO_DARK:-/images/cms-mark.svg}
        NEXT_PUBLIC_BRAND_LOGO_ICON: ${NEXT_PUBLIC_BRAND_LOGO_ICON:-/images/cms-mark.svg}
        NEXT_PUBLIC_BRAND_LOGO_WIDTH: ${NEXT_PUBLIC_BRAND_LOGO_WIDTH:-40}
        NEXT_PUBLIC_BRAND_LOGO_HEIGHT: ${NEXT_PUBLIC_BRAND_LOGO_HEIGHT:-40}
        NEXT_PUBLIC_BRAND_FAVICON: ${NEXT_PUBLIC_BRAND_FAVICON:-/images/cms-icon.png}
        NEXT_PUBLIC_TERMS_URL: ${NEXT_PUBLIC_TERMS_URL:-none}
        NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL:-none}
        NEXT_PUBLIC_SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL:-none}
        NEXT_PUBLIC_UPDATES_URL: ${NEXT_PUBLIC_UPDATES_URL:-none}
        NEXT_PUBLIC_STATUS_URL: ${NEXT_PUBLIC_STATUS_URL:-none}
        NEXT_PUBLIC_COMMUNITY_URL: ${NEXT_PUBLIC_COMMUNITY_URL:-none}
        NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-none}
        NEXT_PUBLIC_SOURCE_URL: ${NEXT_PUBLIC_SOURCE_URL:-none}
    restart: unless-stopped
    env_file:
      - app/.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      INTERNAL_BACKEND_URL: http://api:4000/api/v1
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in api/.env}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/manifest.webmanifest').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

networks:
  database:
    internal: true

volumes:
  mongo-data:
